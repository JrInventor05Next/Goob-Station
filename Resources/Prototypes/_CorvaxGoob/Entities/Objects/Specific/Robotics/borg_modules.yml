- type: entity
  id: BaseBorgModuleSecurity
  parent: BaseBorgModule
  abstract: true
  components:
  - type: Tag
    tags:
    - BorgModuleSecurity
  - type: Item
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#EBD8B7"
      - state: base-module-inhand-left
        color: "#613D1D"
      - state: base-stripes-inhand-left
        color: "#593718"
      right:
      - state: base-icon-inhand-right
        color: "#EBD8B7"
      - state: base-module-inhand-right
        color: "#613D1D"
      - state: base-stripes-inhand-right
        color: "#593718"

- type: entity
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  id: BorgModuleLethal
  name: lethal borg module
  components:
  - type: Sprite
    layers:
    - state: security
    - state: icon-xenoborg-laser2
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: xenoborg-laser2-module }
  - type: ItemBorgModule
    moduleId: lethal
    items:
    - WeaponAntiqueLaser
    - Truncheon
  - type: DroppableBorgModule
    moduleId: lethal
    items:
    - id: Handcuffs
      whitelist:
        tags:
        - Handcuffs
