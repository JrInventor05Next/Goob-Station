# Security borg
- type: borgType
  id: security

  # Description
  dummyPrototype: BorgChassisSecurity

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSecurity

  defaultModules:
  # - BorgModuleStun
  - BorgModuleLethal

  lawset: RobocopLawset

  radioChannels:
  - Security
  - Science

  # Visual
  inventoryTemplateId: borgDutch
  spriteBodyState: security
  spriteHasMindState: security_e
  spriteNoMindState: security_e_r
  spriteToggleLightState: security_l

  # Pet
  petSuccessString: petting-success-security-cyborg
  petFailureString: petting-failure-security-cyborg

  addComponents:
  - type: ItemCreator
    action: ActionSpawnHandCuffs
    charge: 2.5
    spawnedPrototype: Handcuffs
    noPowerPopup: item-switch-failed-no-power
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: ShowContrabandDetails
  - type: UserInterface
    interfaces:
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
        requireInputValidation: false
      enum.BorgUiKey.Key:
        type: BorgBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      # Only used for NT borgs that can switch type, defined here to avoid copy-pasting the rest of this component.
      enum.BorgSwitchableTypeUiKey.SelectBorgType:
        type: BorgSelectTypeUserInterface
      # Goobstation - Add the station map interface to the borg
      enum.StationMapUiKey.Key:
        type: StationMapBoundUserInterface
      enum.SetWantedVerbMenu.Key: # Goobstation-WantedMenu
        type: WantedMenuBoundUserInterface
  # Goobstation - Add the station map interface to the borg
  - type: IntrinsicUI
    uis:
      enum.StationMapUiKey.Key:
        toggleAction: ActionShowStationMap
  - type: Contraband
    allowedDepartments: [ Security ]
    allowedJobs: [ BlueshieldOfficer ] # Goob - effectively almost a sec member
  - type: ActionGrant
    actions:
    - ActionSpawnHandCuffs
  - type: ItemActionGrant
    actions:
    - ActionSpawnHandCuffs
